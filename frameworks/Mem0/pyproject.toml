[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0ai"
version = "2.0.2"
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["qdrant-client>=1.12.0", "pydantic>=2.7.3", "openai>=1.90.0", "posthog>=4.5.0", "pytz>=2024.1", "sqlalchemy>=2.0.31", "protobuf>=5.29.6,<7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mem0*"]
